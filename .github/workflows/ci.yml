name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  outlook-otp-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/outlook-otp-autofill/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
